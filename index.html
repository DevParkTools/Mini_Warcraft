<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>크라운폴: 철아귀 전쟁</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;object-fit:contain;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const cv=document.getElementById('cv');
const X=cv.getContext('2d');
const DW=1280,DH=720,HK=1.125,HR=203;
let W=1280,H=720,VH=540,PORT=false,TALL=false;
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const LAY={w:0,h:0};
const ROTN=['자동','가로 고정','세로 고정'];
let ROT=0,ROTD=false;
try{ROT=parseInt(localStorage.getItem('cf_rot'),10)||0;if(ROT<0||ROT>2)ROT=0;}catch(er){}
function layoutCheck(){
const vv=window.visualViewport;
const iw=Math.round((vv&&vv.width)||window.innerWidth||0),ih=Math.round((vv&&vv.height)||window.innerHeight||0);
if(iw&&ih&&(iw!==LAY.w||ih!==LAY.h)){const ow=W,oh=H;setLayout();if(typeof G!=='undefined'&&G&&scene===1)camTo(G.cam.x+ow/ZM/2,G.cam.y+270/ZM);}
}
function setLayout(){
const vv=window.visualViewport;
let iw=Math.round((vv&&vv.width)||window.innerWidth||document.documentElement.clientWidth||1280),ih=Math.round((vv&&vv.height)||window.innerHeight||document.documentElement.clientHeight||720);
LAY.w=iw;LAY.h=ih;
ROTD=(ROT===1&&ih>iw)||(ROT===2&&iw>ih);
const cs=cv.style;
if(ROTD){cs.width=ih+'px';cs.height=iw+'px';cs.transformOrigin='0 0';cs.transform='translateX('+iw+'px) rotate(90deg)';const t=iw;iw=ih;ih=t;}
else{cs.width='';cs.height='';cs.transformOrigin='';cs.transform='';}
const port=ih>iw*1.15;
if(port){W=1280;H=Math.max(720,Math.min(3000,Math.round(1280*ih/iw)));VH=540;}
else{W=Math.max(1280,Math.min(1600,Math.round(720*iw/ih)));H=720;VH=540;}
PORT=false;TALL=port;cv.width=W;cv.height=H;
if(window.__vigReady)rebuildVig();
}
setLayout();
let ZM=1;
function zmMin(){return Math.max(W/WW,VH/WH,0.6);}
function camClamp(){G.cam.x=clamp(G.cam.x,0,WW-W/ZM);G.cam.y=clamp(G.cam.y,0,WH-VH/ZM);}
function camTo(x,y){ZM=clamp(ZM,zmMin(),1.8);G.cam.x=clamp(x-W/ZM/2,0,WW-W/ZM);G.cam.y=clamp(y-VH/ZM/2,0,WH-VH/ZM);}
function setZoom(z,sx,sy){const wx=G.cam.x+sx/ZM,wy=G.cam.y+sy/ZM;ZM=clamp(z,zmMin(),1.8);G.cam.x=wx-sx/ZM;G.cam.y=wy-sy/ZM;camClamp();}
const FONT='"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const OUT='#150e07';
let T=0;
let scene=0;
const opt={bv:1,sv:1,spd:1,tut:true,sound:true,map:0,diff:1,pr:0,ar:1,pc:0,ac:1,hc:0};
const PCOL=['#3a8aff','#ff4a3a','#2ee6b0','#9a4ad8','#ffb020','#3ddb4a','#ff7ac0','#d8d8d8'];
const HCM=[1,0.8,1.25];

function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rnd(a,b){return a+Math.random()*(b-a);}
function d2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}

function applyVol(){if(bgmG)bgmG.gain.value=0.2*opt.bv;if(sfxG)sfxG.gain.value=0.55*opt.sv;}
let AC=null,master=null,bgmG=null,sfxG=null,noiseBuf=null;
let bgmMode='title',bgmNext=0,bgmStepN=0,bgmTimer=0;
const sfxLast={};
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const SCALE=[69,72,74,76,79,81,84];

function noteHz(n){return 440*Math.pow(2,(n-69)/12);}

function audioInit(){
if(AC){if(AC.state==='suspended')AC.resume();return;}
try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
master=AC.createGain();master.gain.value=opt.sound?0.8:0;master.connect(AC.destination);
bgmG=AC.createGain();bgmG.gain.value=0.2;bgmG.connect(master);
sfxG=AC.createGain();sfxG.gain.value=0.55;sfxG.connect(master);
applyVol();
noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
const d=noiseBuf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
bgmNext=AC.currentTime+0.1;
bgmTimer=setInterval(bgmTick,100);
}

function setSound(on){
opt.sound=on;
if(master)master.gain.value=on?0.8:0;
}

function tone(f,t,d,type,vol,dest,slide){
const o=AC.createOscillator(),g=AC.createGain();
o.type=type;o.frequency.setValueAtTime(f,t);
if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);
g.gain.setValueAtTime(0.0001,t);
g.gain.exponentialRampToValueAtTime(vol,t+0.012);
g.gain.exponentialRampToValueAtTime(0.0001,t+d);
o.connect(g);g.connect(dest);
o.start(t);o.stop(t+d+0.05);
}

function noiseHit(t,d,vol,freq,dest){
const s=AC.createBufferSource();s.buffer=noiseBuf;
const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=0.8;
const g=AC.createGain();
g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
s.connect(f);f.connect(g);g.connect(dest);
s.start(t,Math.random()*0.5);s.stop(t+d+0.05);
}

function sfx(n){
if(!AC||!opt.sound)return;
const t=AC.currentTime;
const last=sfxLast[n]||0;
if(t-last<0.05)return;
sfxLast[n]=t;
switch(n){
case 'click':tone(660,t,0.06,'square',0.12,sfxG);break;
case 'move':tone(300,t,0.08,'triangle',0.2,sfxG,200);break;
case 'err':tone(140,t,0.18,'sawtooth',0.18,sfxG,100);break;
case 'swing':noiseHit(t,0.08,0.18,1800,sfxG);break;
case 'hit':noiseHit(t,0.1,0.35,900,sfxG);tone(150,t,0.1,'square',0.18,sfxG,70);break;
case 'bhit':noiseHit(t,0.14,0.4,500,sfxG);tone(90,t,0.16,'square',0.22,sfxG,50);break;
case 'die':tone(260,t,0.35,'sawtooth',0.18,sfxG,60);noiseHit(t,0.2,0.25,700,sfxG);break;
case 'spell':tone(300,t,0.5,'sawtooth',0.18,sfxG,1200);tone(600,t,0.5,'sine',0.15,sfxG,1800);break;
case 'beam':noiseHit(t,0.35,0.5,2500,sfxG);tone(900,t,0.35,'square',0.2,sfxG,120);break;
case 'shield':tone(520,t,0.4,'sine',0.22,sfxG,780);tone(780,t+0.08,0.4,'sine',0.18,sfxG,1040);break;
case 'shout':tone(180,t,0.5,'sawtooth',0.22,sfxG,260);tone(270,t,0.5,'square',0.12,sfxG,390);break;
case 'build':tone(200,t,0.05,'square',0.2,sfxG);noiseHit(t,0.06,0.2,1500,sfxG);break;
case 'done':tone(523,t,0.12,'triangle',0.25,sfxG);tone(659,t+0.1,0.12,'triangle',0.25,sfxG);tone(784,t+0.2,0.25,'triangle',0.25,sfxG);break;
case 'train':tone(660,t,0.1,'triangle',0.25,sfxG);tone(880,t+0.09,0.18,'triangle',0.25,sfxG);break;
case 'gold':tone(1200,t,0.08,'sine',0.18,sfxG);tone(1600,t+0.06,0.12,'sine',0.18,sfxG);break;
case 'wood':noiseHit(t,0.06,0.3,400,sfxG);tone(120,t,0.07,'square',0.15,sfxG);break;
case 'lvl':for(let i=0;i<4;i++)tone(noteHz(72+i*4),t+i*0.08,0.3,'triangle',0.22,sfxG);break;
case 'alert':tone(440,t,0.15,'square',0.2,sfxG);tone(440,t+0.2,0.15,'square',0.2,sfxG);break;
case 'win':for(let i=0;i<6;i++)tone(noteHz(60+[0,4,7,12,16,19][i]),t+i*0.14,0.5,'triangle',0.25,sfxG);break;
case 'lose':for(let i=0;i<5;i++)tone(noteHz(64-i*2),t+i*0.22,0.6,'sawtooth',0.16,sfxG);break;
}
}

let bgmRace=0;
const BGR=[
{bpm:112,prog:[[60,64,67],[65,69,72],[55,59,62],[57,60,64]],sc:[72,74,76,79,81,84],pad:'sine',padV:0.11,bass:'triangle',arp:'triangle',arpV:0.15,arpD:0.9,lead:'triangle',leadV:0.15,leadP:48,leadD:2.2},
{bpm:100,prog:[[45,48,52],[46,50,53],[45,48,52],[43,46,50]],sc:[57,60,62,64,67,69],pad:'sawtooth',padV:0.05,bass:'square',arp:'square',arpV:0.05,arpD:0.7,lead:'sawtooth',leadV:0.07,leadP:30,leadD:1.6},
{bpm:72,prog:[[57,60,64],[56,59,63],[53,56,60],[54,57,61]],sc:[81,84,87,88,91,93],pad:'sine',padV:0.14,bass:'sine',arp:'sine',arpV:0.07,arpD:2.4,lead:'sine',leadV:0.12,leadP:22,leadD:3.4},
{bpm:96,prog:[[55,59,62],[57,60,64],[52,55,59],[50,54,57]],sc:[74,76,79,81,83,86],pad:'sine',padV:0.09,bass:'triangle',arp:'triangle',arpV:0.2,arpD:0.5,lead:'sine',leadV:0.14,leadP:40,leadD:2.6}
];
function bgmStepRace(t,s,sd){
const P=BGR[bgmRace]||BGR[0],bar=(s>>3)&3,i=s&7,ch=P.prog[bar];
if(i===0)for(let k=0;k<3;k++)tone(noteHz(ch[k]),t,sd*8,P.pad,P.padV,bgmG);
if(i%4===0)tone(noteHz(ch[0]-12),t,sd*3.6,P.bass,0.42,bgmG);
tone(noteHz(ch[i%3]+12),t,sd*P.arpD,P.arp,P.arpV,bgmG);
const h=((s*2654435761)>>>0)%100;
if(i%2===0&&h<P.leadP)tone(noteHz(P.sc[h%P.sc.length]),t,sd*P.leadD,P.lead,P.leadV,bgmG,bgmRace===2?noteHz(P.sc[h%P.sc.length])*0.97:0);
if(bgmRace===0){
if(i%4===0)tone(120,t,0.18,'sine',0.45,bgmG,40);
if(i===4)noiseHit(t,0.14,0.25,1800,bgmG);
if(i%2===1)noiseHit(t,0.04,0.07,7000,bgmG);
if(i===0&&bar%2===0)tone(noteHz(ch[0]),t,sd*2,'sawtooth',0.06,bgmG);
}else if(bgmRace===1){
if(i%4===0)tone(90,t,0.25,'sine',0.6,bgmG,35);
if(i===3||i===6)tone(140,t,0.15,'sine',0.4,bgmG,60);
if(i===4)noiseHit(t,0.16,0.3,1200,bgmG);
if(i===0)tone(noteHz(ch[0]-24),t,sd*8,'sawtooth',0.09,bgmG);
}else if(bgmRace===2){
if(i===0)tone(55,t,0.3,'sine',0.5,bgmG,35);
if(i===1)tone(55,t,0.25,'sine',0.35,bgmG,35);
if(i===0&&bar%2===1)tone(noteHz(ch[2]+24),t,sd*6,'sine',0.07,bgmG);
if(h<10&&i%2===1)noiseHit(t,0.5,0.05,3000,bgmG);
}else{
if(i%4===0)tone(110,t,0.12,'sine',0.25,bgmG,50);
if(i%2===1)noiseHit(t,0.03,0.05,8000,bgmG);
if(i===6)noiseHit(t,0.06,0.1,2500,bgmG);
}
}
function setBgm(m,r){
r=r|0;
if(m==='battle'&&bgmMode==='battle'&&bgmRace===r&&bgmStepN>0)return;
bgmRace=r;
bgmMode=m;bgmStepN=0;
if(AC)bgmNext=AC.currentTime+0.1;
}

function bgmTick(){
if(!AC||!opt.sound)return;
const battle=bgmMode==='battle';
const sd=60/(battle?(BGR[bgmRace]||BGR[0]).bpm:76)/2;
if(bgmNext<AC.currentTime)bgmNext=AC.currentTime+0.05;
while(bgmNext<AC.currentTime+0.4){
if(battle)bgmStepRace(bgmNext,bgmStepN,sd);else bgmStep(bgmNext,bgmStepN,sd,battle);
bgmNext+=sd;bgmStepN++;
}
}

function bgmStep(t,s,sd,battle){
const bar=(s>>3)&3,i=s&7;
const ch=PROG[bar];
if(i===0){
for(let k=0;k<3;k++)tone(noteHz(ch[k]),t,sd*8,'sine',0.1,bgmG);
}
if(i%4===0)tone(noteHz(ch[0]-12),t,sd*3.6,'triangle',0.45,bgmG);
tone(noteHz(ch[i%3]+12),t,sd*0.9,'sine',battle?0.16:0.1,bgmG);
const h=((s*2654435761)>>>0)%100;
if(i%2===0&&h<(battle?48:36))tone(noteHz(SCALE[h%SCALE.length]),t,sd*2.2,'triangle',0.15,bgmG);
if(battle){
if(i%4===0){tone(120,t,0.18,'sine',0.5,bgmG,40);}
if(i%4===2)noiseHit(t,0.14,0.25,1800,bgmG);
if(i%2===1)noiseHit(t,0.04,0.08,7000,bgmG);
}
}

const TK=1.5;
function hudPt(x,y){
if(y<VH)return {x:x,y:y};
if(!PORT)return {x:x-(W-1280)/2,y:y};
const yy=y-VH,p=yy>=HR?1:0;
return {x:x/HK+p*640,y:540+(yy-p*HR)/HK};
}
function hudPass(fn){
if(!PORT){
if(W===1280){fn(X);return;}
const lx=(W-1280)/2;
X.drawImage(hudBase.c,0,540,24,180,0,VH,lx+1,180);
X.drawImage(hudBase.c,1256,540,24,180,W-lx-1,VH,lx+1,180);
X.save();X.translate(lx,0);fn(X);X.restore();
return;
}
for(let p=0;p<2;p++){
X.save();
X.beginPath();X.rect(0,VH+p*HR,W,HR);X.clip();
X.translate(0,VH+p*HR);X.scale(HK,HK);X.translate(-p*640,-540);
fn(X);
X.restore();
}
}

function menuK(){return Math.min(W/DH,H/DW);}
function dsBegin(mode,clear){
X.save();
if(clear){X.fillStyle='#000';X.fillRect(0,0,W,H);}
if(mode===1){
const k=menuK();
X.translate(W/2,H/2);X.rotate(Math.PI/2);X.scale(k,k);X.translate(-DW/2,-DH/2);
}else{
X.translate((W-DW)/2,TALL?0:(H-DH)/2);
}
}
function dsEnd(){X.restore();}
function dsInv(x,y,mode){
if(mode===1){
const k=menuK(),sx=x-W/2,sy=y-H/2;
return {x:sy/k+DW/2,y:-sx/k+DH/2};
}
return {x:x-(W-DW)/2,y:y-(TALL?0:(H-DH)/2)};
}
function ptMode(){
if(scene!==1)return PORT?0:2;
if(G.paused||(G.over&&G.overT>2.0))return 2;
return 0;
}
window.addEventListener('resize',function(){
const ow=W,oh=H;
setLayout();
if(typeof G!=='undefined'&&G&&scene===1)camTo(G.cam.x+ow/ZM/2,G.cam.y+(oh<=720?540:oh-2*HR)/ZM/2);
});

const PM={tx:0,ty:0,sc:1};
function pmBegin(tx,ty,sc){X.save();X.translate(tx,ty);X.scale(sc,sc);PM.tx=tx;PM.ty=ty;PM.sc=sc;}
function pmEnd(){X.restore();PM.tx=0;PM.ty=0;PM.sc=1;}
function pmx(){return (ms.x-PM.tx)/PM.sc;}
function pmy(){return (ms.y-PM.ty)/PM.sc;}
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=mb(20261104);

function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return {c:c,g:c.getContext('2d')};}

function rr(g,x,y,w,h,r){
g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}

function P(g,fill,lw){
g.fillStyle=fill;g.fill();
g.lineWidth=lw||2;g.strokeStyle=OUT;g.lineJoin='round';g.stroke();
}
function box(g,x,y,w,h,fill,lw){g.beginPath();g.rect(x,y,w,h);P(g,fill,lw);}
function circ(g,x,y,r,fill,lw){g.beginPath();g.arc(x,y,r,0,7);P(g,fill,lw);}
function ell(g,x,y,rx,ry,fill,lw){g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);P(g,fill,lw);}
function tri(g,ax,ay,bx,by,cx,cy,fill,lw){g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.lineTo(cx,cy);g.closePath();P(g,fill,lw);}
function poly(g,p,fill,lw){g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();P(g,fill,lw);}

function shadow(g,x,y,r){
g.fillStyle='rgba(0,0,0,.32)';g.beginPath();g.ellipse(x+2,y+2,r,r*0.4,0,0,7);g.fill();
}
function treeS(g,x,y,s,v){
shadow(g,x+6*s,y,20*s);
if(v===0){
box(g,x-3.5*s,y-15*s,7*s,15*s,'#6b4627',1.5);
circ(g,x-10*s,y-26*s,12*s,'#2b5e2e',1.5);
circ(g,x+10*s,y-27*s,12*s,'#2f6a31',1.5);
circ(g,x,y-39*s,15*s,'#3f8a3a',1.5);
g.fillStyle='rgba(160,225,105,.5)';g.beginPath();g.arc(x-5*s,y-44*s,7*s,0,7);g.fill();
}else{
box(g,x-3*s,y-12*s,6*s,12*s,'#6b4627',1.5);
const c=['#245428','#2e6a32','#3d8540'];
for(let i=0;i<3;i++){
const w=(23-i*5)*s,by=y-(8+i*13)*s;
tri(g,x-w,by,x,by-23*s,x+w,by,c[i],1.5);
g.fillStyle='rgba(170,235,115,.28)';
g.beginPath();g.moveTo(x-w+1,by-1);g.lineTo(x,by-22*s);g.lineTo(x,by-1);g.closePath();g.fill();
}
}
}

const goldPts=[[-24,-14],[-8,-34],[14,-24],[30,-10],[2,-14],[-34,-4]];
function mineS(g,x,y){
shadow(g,x+8,y,64);
g.beginPath();g.moveTo(x-54,y);g.quadraticCurveTo(x-50,y-60,x-6,y-68);g.quadraticCurveTo(x+42,y-72,x+58,y);g.closePath();
P(g,'#6a6572',2.5);
g.fillStyle='#8f8a99';
g.beginPath();g.moveTo(x-40,y-10);g.quadraticCurveTo(x-32,y-50,x-4,y-58);g.quadraticCurveTo(x+22,y-60,x+24,y-34);g.quadraticCurveTo(x-6,y-38,x-40,y-10);g.fill();
g.fillStyle='rgba(0,0,0,.22)';
g.beginPath();g.moveTo(x+24,y-34);g.quadraticCurveTo(x+22,y-60,x+42,y-70);g.quadraticCurveTo(x+58,y-30,x+58,y);g.lineTo(x+30,y);g.closePath();g.fill();
g.beginPath();g.moveTo(x-16,y);g.lineTo(x-16,y-20);g.arc(x,y-20,16,Math.PI,0);g.lineTo(x+16,y);g.closePath();
P(g,'#0f0a06',2);
g.fillStyle='rgba(255,200,80,.3)';g.beginPath();g.ellipse(x,y-10,10,14,0,0,7);g.fill();
box(g,x-21,y-26,6,26,'#6b4627',1.5);box(g,x+15,y-26,6,26,'#6b4627',1.5);box(g,x-24,y-31,48,6,'#7b5230',1.5);
for(let i=0;i<goldPts.length;i++){
const p=goldPts[i];
poly(g,[x+p[0],y+p[1]-6,x+p[0]+5,y+p[1],x+p[0],y+p[1]+5,x+p[0]-5,y+p[1]],'#f7c948',1.3);
g.fillStyle='#fffbe0';g.globalAlpha=0.5+0.5*Math.sin(T*3+i*1.7);g.fillRect(x+p[0]-1,y+p[1]-3,2.5,2.5);g.globalAlpha=1;
}
}

function wallBricks(g,x,y,w,h){

if(!dx&&!dy)continue;
const nx=cx+dx,ny=cy+dy;
if(nx<0||ny<0||nx>=NW||ny>=NH)continue;
const ni=ny*NW+nx;
if(navC[ni]||(nav[ni]&&ni!==si))continue;
if(dx&&dy&&(nav[cy*NW+nx]||nav[ny*NW+cx]))continue;
const ng=navG[cur]+(dx&&dy?1.414:1);
if(ng<navG[ni]){if(navG[ni]>=1e9)navOpen.push(ni);navG[ni]=ng;navP[ni]=cur;}
}
}
if(navG[ti]>=1e9)return null;
const pts=[];
let c=ti;
while(c!==-1&&c!==si){pts.push({x:(c%NW)*NC+NC/2,y:((c/NW)|0)*NC+NC/2});c=navP[c];}
pts.reverse();
const out=[];
let ax=sx,ay=sy,i=0;
while(i<pts.length){
let j=pts.length-1;

}

}

function pushOut(u){
if(u.fly)return;
const cx=(u.x/80)|0,cy=(u.y/80)|0;
for(let ax=cx-1;ax<=cx+1;ax++)for(let ay=cy-1;ay<=cy+1;ay++){
const a=grid.get(ax*1000+ay);
if(!a)continue;
for(let i=0;i<a.length;i++){
const o=a[i];
const rad=(o.isB?o.r*0.85:o.r*0.9)+u.r;
const dx=u.x-o.x,dy=u.y-o.y,dd=dx*dx+dy*dy;
if(dd<rad*rad&&dd>0.01){
const d=Math.sqrt(dd),k=(rad-d)/d;
u.x+=dx*k;u.y+=dy*k;
}
}
}
const lx=(u.x-LAKE.x)/(LAKE.rx+u.r),ly=(u.y-LAKE.y)/(LAKE.ry+u.r);
const ld=lx*lx+ly*ly;
if(ld<1){
const d=Math.sqrt(ld)||0.01;
u.x=LAKE.x+(u.x-LAKE.x)/d;u.y=LAKE.y+(u.y-LAKE.y)/d;
}
u.x=clamp(u.x,20,WW-20);u.y=clamp(u.y,30,WH-20);
}

function lakeWay(u,tx,ty){
const ex=LAKE.rx+u.r+14,ey=LAKE.ry+u.r+14;
const ax=(u.x-LAKE.x)/ex,ay=(u.y-LAKE.y)/ey,bx=(tx-LAKE.x)/ex,by=(ty-LAKE.y)/ey;
const sx=bx-ax,sy=by-ay,sl=sx*sx+sy*sy;
if(sl<1e-6)return null;
let t=-(ax*sx+ay*sy)/sl;
if(t<=0||t>=1)return null;
const cx=ax+sx*t,cy=ay+sy*t,cd=Math.hypot(cx,cy);
if(cd>=1)return null;
let nx,ny;
if(cd<0.08){const sg=u.id%2?1:-1;nx=-sy/Math.sqrt(sl)*sg;ny=sx/Math.sqrt(sl)*sg;}else{nx=cx/cd;ny=cy/cd;}
return {x:LAKE.x+nx*1.35*ex,y:LAKE.y+ny*1.35*ey};
}

function stepTo(u,tx,ty,dt,stop){
const ox0=tx,oy0=ty;
if(!u.fly&&u.team<2&&d2(u.x,u.y,tx,ty)>(stop+90)*(stop+90)){
if(navDirty)navBuild();
u.pathCd=(u.pathCd||0)-dt;
if(u.path&&(Math.abs(u.pkx-ox0)>60||Math.abs(u.pky-oy0)>60||u.stuck>1.2)){u.path=null;if(u.stuck>1.2)u.stuck=0;}
if(!u.path&&u.pathCd<=0&&!navClear(u.x,u.y,tx,ty,28,stop+60)){
u.pathCd=0.7;
u.path=navFind(u.x,u.y,tx,ty);u.pi=0;u.pkx=ox0;u.pky=oy0;
}
if(u.path){
while(u.pi<u.path.length&&d2(u.x,u.y,u.path[u.pi].x,u.path[u.pi].y)<26*26)u.pi++;

else{
if(navClear(u.x,u.y,tx,ty,28,stop+60)){u.path=null;}
else{const wp=u.path[u.pi];tx=wp.x;ty=wp.y;stop=0;}
}

let dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy);
if(tx!==ox0||ty!==oy0){if(d<8){tx=ox0;ty=oy0;dx=tx-u.x;dy=ty-u.y;d=Math.hypot(dx,dy);}}
if(d<=stop)return true;
const sp=(u.gs&&(u.ord==='move'||u.ord==='amove')&&u.gs<u.spd?u.gs:u.spd)*(u.buff>0?1.2:1)*(u.slow>0?0.5:1)*dt;
const m=Math.min(sp,d-stop+0.5);

if(u.stuck>0.35){const sg=u.ph>3?1:-1;mx+=-dy/d*sp*0.9*sg;my+=dx/d*sp*0.9*sg;}
u.x+=mx;u.y+=my;
pushOut(u);
if(Math.abs(dx)>1)u.face=dx>0?1:-1;
u.moving=true;
const prog=Math.hypot(u.x-ox,u.y-oy);
u.fx=dx/d;u.fy=dy/d;u.wp=(u.wp||0)+prog*0.3;
if(prog<m*0.25)u.stuck+=dt;else u.stuck=Math.max(0,u.stuck-dt*2);
return false;
}

{const ddx=t.x-u.x,ddy=t.y-u.y,dl=Math.hypot(ddx,ddy)||1;u.fx=ddx/dl;u.fy=ddy/dl;}

}else u.hit={t:t,a:a,d:rel,r:0};
}

function doAttack(u,dt){
const t=u.tgt;
if(!alive(t)||!canHit(u,t)){u.tgt=null;u.ord=u.am?'amove':'idle';return;}
const reach=u.rng+u.r+t.r*(t.isB?0.85:0.9);

}
}

function canCast(h,s){

function dispel(u){

for(let i=0;i<G.units.length;i++){

if(e.team!==0||e.hp<=0)continue;
const d=d2(u.x,u.y,e.x,e.y);
if(d<bd){bd=d;best=e;}

if(!best)return;

function popQueue(u){
const n=u.oq.shift();u.qrun=true;
if(n.k==='gather'){if(n.t&&(n.t.isM?n.t.gold>0:n.t.alive))startGather(u,n.t);return;}
if(n.k==='build'){if(alive(n.t)&&!n.t.done){u.ord='build';u.tgt=n.t;u.gt=0;u.stuck=0;}return;}
if(n.k==='move'){u.ord='move';u.tx=n.x;u.ty=n.y;u.am=false;}
else if(n.k==='amove'){u.ord='amove';u.tx=n.x;u.ty=n.y;u.am=true;}
else if(n.k==='attack'&&alive(n.t)){u.ord='attack';u.tgt=n.t;u.am=false;}
u.stuck=0;
}
function updateUnit(u,dt){
if(u.hp<=0)return;
if(u.slow>0)u.slow-=dt;
if(u.sil>0)u.sil-=dt;
if(u.cast>0)u.cast-=dt;
if(u.rc>0)u.rc-=dt;
if(u.pc>0)u.pc-=dt;
if(u.hit){u.hit.d-=dt;if(u.hit.d<=0)applyHit(u);}
if(u.stun>0){u.stun-=dt;u.moving=false;u.acd-=dt;u.flash-=dt;u.swing-=dt;return;}
if(u.rg&&u.hp>0&&u.hp<u.mhp)u.hp=Math.min(u.mhp,u.hp+u.rg*dt);
if(u.oq&&u.oq.length&&u.ord==='idle')popQueue(u);
else if(u.qrun&&u.ord==='idle')u.qrun=false;
u.acd-=dt;u.flash-=dt;u.swing-=dt;u.scd-=dt;
if(u.shield>0)u.shield-=dt;
if(u.buff>0)u.buff-=dt;
u.moving=false;
if(u.hidden&&!(u.ord==='gather'&&u.gph===1)&&!(u.ord==='build'&&u.inB)){u.hidden=false;if(u.res&&u.res.users){const ix=u.res.users.indexOf(u);if(ix>=0)u.res.users.splice(ix,1);}}
if(u.k==='hero'){
u.cq-=dt;u.cw-=dt;u.ce-=dt;u.cr-=dt;
if(u.team===1&&u.pts>0){for(let i=0;i<4&&u.pts>0;i++){const o=[0,2,1,3][i];if(!canLearn(u,o))learnSkill(u,o);}}
if(u.team===0){
u.mana=Math.min(u.mmana,u.mana+(1.6+0.4*u.lv)*dt);
u.hp=Math.min(u.mhp,u.hp+0.8*dt);
}else{
u.mana=Math.min(u.mmana,u.mana+(1.6+0.4*u.lv)*dt);
u.aiT-=dt;
if(u.aiT<=0){u.aiT=0.5;aiCast(u);}
if(u.sk[0]+u.sk[1]+u.sk[2]===0&&u.cq<=0){
for(let i=0;i<G.units.length;i++){const e=G.units[i];if(e.team===0&&e.hp>0&&d2(u.x,u.y,e.x,e.y)<100*100){stomp(u);break;}}
}
}
}
if(u.team===2){

if(u.scd<=0){u.scd=0.4;const e=findEnemy(u,nightAmt()>0.5?55:170,0);if(e&&d2(u.x,u.y,cp.x,cp.y)<380*380){u.tgt=e;u.ord='attack';u.am=true;}}

}

}
if(u.k==='priest'&&u.hp>0){

u.hcd=(u.hcd||0)-dt;u.dcd=(u.dcd||0)-dt;u.scdn=(u.scdn||0)-dt;
if(!u.noAuto&&u.scdn<=0&&u.mana>=30){
u.scdn=1;
for(let i=0;i<G.units.length;i++){const e=G.units[i];if(e.team!==u.team&&e.k==='hero'&&e.hp>0&&!(e.sil>0)&&d2(u.x,u.y,e.x,e.y)<280*280){e.sil=5;u.pc=0.45;u.mana-=30;u.scdn=20;G.fx.push({k:'ring',x:e.x,y:e.y,t:0,d:0.8,c:'190,120,255',rad:70});addText(e.x,e.y-e.r*2-10,'침묵','#c9a0ff');if(e.team===0||u.team===0)sfx('spell');break;}}

}
}
}
switch(u.ord){

else if(u.stuck>1.6){

if(!u.tgt&&u.scd<=0){u.scd=0.3;const e=findEnemy(u,u.rng+u.r+14,u.rng+u.r+30);if(e)u.tgt=e;}

if(e){u.tgt=e;u.ord='attack';u.am=true;break;}
}
const arr=stepTo(u,u.tx,u.ty,dt,10);
let giveUp=arr;
if(!arr&&u.stuck>2){
if(d2(u.x,u.y,u.tx,u.ty)<90*90||(u.rtry=(u.rtry||0)+1)>4)giveUp=true;
else{u.path=null;u.pathCd=0;u.stuck=0;}
}
if(giveUp){
u.rtry=0;
if(u.pat){const p=u.pat;u.pat=[u.tx,u.ty];u.tx=p[0];u.ty=p[1];u.stuck=0;}else{u.ord='idle';u.stuck=0;}
}
break;
case 'attack':
if(u.stance===1&&!u.am&&u.hx!==undefined&&d2(u.x,u.y,u.hx,u.hy)>300*300){u.tgt=null;u.ord='move';u.tx=u.hx;u.ty=u.hy;break;}
doAttack(u,dt);
break;
case 'cast':
if(stepTo(u,u.tx,u.ty,dt,300)){
if(canCast(u,u.cast)===''){castAt(u,u.cast,u.tx,u.ty);}
u.ord='idle';
}else if(u.stuck>1.6){u.ord='idle';u.stuck=0;}
break;
case 'gather':
doGather(u,dt);
break;
case 'build':
doBuild(u,dt);
break;
default:
if(u.k!=='worker'&&u.scd<=0){
u.scd=0.4;
const e=findEnemy(u,u.stance?u.rng+70:u.sight*0.85,u.stance?u.rng+40:150);
if(e){u.tgt=e;u.ord='attack';u.am=false;u.hx=u.x;u.hy=u.y;}
}
}
}

function doGather(u,dt){
let res=u.res;
const valid=res&&(res.isM?res.gold>0:res.alive);
if(u.gph===0||u.gph===1){
if(!valid){
const nr=u.ctype==='gold'?nearMine(u.x,u.y,u.team):nearTree(u.x,u.y,500);
if(!nr){u.ord='idle';return;}
u.res=res=nr;u.gph=0;
}
}
if(u.gph===0){
if(stepTo(u,res.x,res.y,dt,res.r+u.r+10)||u.stuck>2.5){
if(res.isM&&G.race[u.team]===3&&!entangled(u.team,res)){u.ord='idle';if(u.team===0)say('얽힌 금광이 필요합니다: 근처에 본진을 지으세요');return;}
u.gph=1;u.gt=0;u.stuck=0;
}
}else if(u.gph===1){
if(res.isM){
if(!res.users)res.users=[];
if(res.users.indexOf(u)<0){
if(res.users.length>=MCAP[G.race[u.team]]){u.gt=0;return;}
res.users.push(u);
}
u.hidden=true;
}
u.gt+=dt;
if(u.gt>=(res.isM?MTIME[G.race[u.team]]:(G.race[u.team]===3?7.5:3.6))){
if(res.isM&&G.race[u.team]>=2){
const n=Math.min(G.race[u.team]===3?10:8,res.gold),bn=(u.team?aiGold():1)*upkeep(u.team);res.gold-=n;G.res[u.team].g+=n*bn;u.gt=0;
if(u.team===0){stat('g',n);sfx('gold');addText(res.x+rnd(-14,14),res.y-res.r-10,'+'+Math.round(n*bn)+' 금','#ffd24a',16);}
if(res.gold<=0){const ix=res.users.indexOf(u);if(ix>=0)res.users.splice(ix,1);u.hidden=false;rebuildGrid();}
return;
}
if(!res.isM&&G.race[u.team]===3){
const n=Math.min(5,res.wood);res.wood-=n;G.res[u.team].w+=n*(u.team?aiGold():1);u.gt=0;
if(res.wood<=0){res.alive=false;rebuildGrid();}
if(u.team===0){sfx('wood');addText(u.x,u.y-34,'+'+n+' 나무','#9be36a',16);}
return;
}
if(res.isM){const n=Math.min(10,res.gold);res.gold-=n;u.carry=n;{const ix=res.users.indexOf(u);if(ix>=0)res.users.splice(ix,1);}u.hidden=false;if(res.gold<=0)rebuildGrid();}
else{res.wood-=10;u.carry=10;if(res.wood<=0){res.alive=false;rebuildGrid();}}
u.gph=2;
if(u.team===0&&!res.isM)sfx('wood');
}
}else{
const h=hallFor(u);
if(!h){u.ord='idle';return;}
u.rtT=(u.rtT||0)+dt;
if(stepTo(u,h.x,h.y,dt,h.r*0.85+u.r+8+Math.min(46,u.rtT*5))||u.stuck>2.5){
u.rtT=0;
const bonus=(u.team?aiGold():1)*(u.ctype==='gold'?upkeep(u.team):1);
if(u.ctype==='gold')G.res[u.team].g+=u.carry*bonus;else G.res[u.team].w+=u.carry*bonus;
if(u.team===0)stat(u.ctype==='gold'?'g':'w',u.carry);
if(u.team===0){addText(h.x+rnd(-16,16),h.y-h.r-6,'+'+Math.round(u.carry*bonus)+(u.ctype==='gold'?' 금':' 나무'),u.ctype==='gold'?'#ffd24a':'#9be36a',16);}
if(u.team===0&&u.ctype==='gold')sfx('gold');
u.carry=0;u.gph=0;u.stuck=0;
}
}
}

const MCAP=[1,2,2,5],MTIME=[2,3.4,3,6];
function entangled(team,m){return ownHallNear(team,m,430);}
function consumes(team,k){const r=G.race[team];return r===2||(r===3&&(k==='rax'||k==='tower'||k==='altar'));}
function hides(team){const r=G.race[team];return r===1||r===3;}
function blighted(team,x,y){
for(let i=0;i<G.blds.length;i++){const b=G.blds[i];if(b.team!==team||!b.done)continue;const r=b.k==='hall'?320:(b.k==='farm'?210:0);if(r&&d2(x,y,b.x,b.y)<r*r)return true;}
return false;
}
function finishBld(b){
b.done=true;b.hp=b.mhp;
if(b.team===0){stat('built',1);sfx('done');say(b.k==='farm'?rn(0,'farm')+' 완공! 인구 한도 +6':'건설 완료');}
G.fx.push({k:'puff',x:b.x,y:b.y,t:0,d:0.6});
}

function doBuild(u,dt){
const b=u.tgt;
if(alive(b)&&b.auto&&!b.done){u.ord='idle';u.tgt=null;return;}
if(alive(b)&&b.done&&b.hp<b.mhp&&G.race[u.team]===0){
if(stepTo(u,b.x,b.y,dt,b.r*0.85+u.r+6)||u.stuck>2){
const B=bd(b.team,b.k),heal=Math.min(b.mhp-b.hp,b.mhp/(Math.max(B.time,20)*1.5)*dt),f=heal/b.mhp,r=G.res[u.team];
if(r.g<B.cost[0]*0.35*f||r.w<B.cost[1]*0.35*f){u.ord='idle';u.tgt=null;if(u.team===0)say('수리할 자원이 부족합니다');return;}
r.g-=B.cost[0]*0.35*f;r.w-=B.cost[1]*0.35*f;b.hp+=heal;u.swing=0.1;u.gt+=dt;
if(u.gt>0.6){u.gt=0;if(u.team===0)sfx('build');}
}
return;
}
if(!alive(b)||b.done){
u.ord='idle';u.tgt=null;u.inB=false;
if(u.team===1&&u.home){const m=nearMine(u.x,u.y,1);if(m)startGather(u,m);}
return;
}
if(stepTo(u,b.x,b.y,dt,b.r*0.85+u.r+6)||u.stuck>2){
if(consumes(u.team,b.k)){
b.auto=true;u.hp=0;u.tgt=null;
G.fx.push({k:'puff',x:u.x,y:u.y,t:0,d:0.6});
G.fx.push({k:'ring',x:b.x,y:b.y,t:0,d:0.9,c:RING[G.race[u.team]],rad:b.r+30});
if(u.team===0){sfx('build');G.sel=G.sel.filter(function(e){return e!==u;});}
return;
}
if(hides(u.team)){u.hidden=true;u.inB=true;}
u.gt+=dt;u.swing=0.1;
b.prog=Math.min(1,b.prog+dt/bd(b.team,b.k).time*(u.team?aiSpd():1));
b.hp=Math.min(b.mhp,b.mhp*(0.1+0.9*b.prog));
if(u.gt>0.5){u.gt=0;if(u.team===0)sfx('build');if(G.fx.length<260)G.fx.push({k:'spark',x:b.x+rnd(-b.r*0.6,b.r*0.6),y:b.y-rnd(0,b.r*0.8),t:0,d:0.3,c:'255,220,140'});if(Math.random()<0.5)G.fx.push({k:'puff',x:b.x+rnd(-b.r,b.r),y:b.y+b.r*0.3,t:0,d:0.5});}
if(b.prog>=1)finishBld(b);
}
}

function enqueue(b,k,ht){
const team=b.team,d=ud(team,k),r=G.res[team];
ht=ht||0;
let cost=d.cost,tm=d.time;
const hvd=k==='hero'&&team===0?G.hv[ht]:null;
if(hvd&&hvd.dead){const l=hvd.lv;cost=[100+l*40,0];tm=20+l*5;}else if(k==='hero'&&ht>0){cost=[cost[0]+40*ht,cost[1]+10*ht];}
const fr=k==='hero'&&ht===0&&!(hvd&&hvd.dead)&&G.hfree[team];if(fr)cost=[0,0];
if(!b.done)return '건설 중입니다';
if(b.q.length>=5)return '대기열이 가득 찼습니다';
if(r.g<cost[0]||r.w<cost[1])return r.g<cost[0]?'금이 부족합니다':'나무가 부족합니다';
if(G.popUsed[team]+d.food>G.popCap[team])return '농장이 필요합니다 (인구 한도)';
if(k==='knight'||k==='priest'){const h=hallFor({team:team,x:b.x,y:b.y});if(!h||!h.tier)return '성채 업그레이드가 필요합니다';}
if(k==='flyer'){const h=hallFor({team:team,x:b.x,y:b.y});if(!h||!h.tier)return '성채 업그레이드가 필요합니다';}
if(k==='siege'&&maxTier(team)<2)return '대성 업그레이드가 필요합니다';
if(k==='hero'){
let cnt=0;
for(let i=0;i<G.units.length;i++){const o=G.units[i];if(o.k==='hero'&&o.team===team&&o.hp>0){if(o.ht===ht)return '이미 같은 영웅이 있습니다';cnt++;}}
for(let i=0;i<G.blds.length;i++){const o=G.blds[i];if(o.team===team)for(let j=0;j<o.q.length;j++)if(o.q[j].k==='hero'){if(o.q[j].ht===ht)return '이미 영웅을 소환 중입니다';cnt++;}}
if(cnt>=heroCap(team))return heroCap(team)>1?'영웅은 최대 3명까지 둘 수 있습니다':'선술집이 있어야 영웅을 더 둘 수 있습니다';
}
r.g-=cost[0];r.w-=cost[1];
if(fr)G.hfree[team]=false;
b.q.push({k:k,t:0,cost:cost,time:tm,ht:ht,fr:fr});
return '';
}

const UPC=[[320,210,40],[400,250,55]];
function upgradeHall(b){
const r=G.res[b.team];
if(!b.done)return '건설 중입니다';
if(b.upT>0)return '업그레이드 중입니다';
if(b.tier>=2)return '최대 단계입니다';
const c=UPC[b.tier];
if(r.g<c[0]||r.w<c[1])return r.g<c[0]?'금이 부족합니다':'나무가 부족합니다';
r.g-=c[0];r.w-=c[1];b.upT=c[2];b.upN=b.tier;
return '';
}

function maxTier(team){let m=0;for(let i=0;i<G.blds.length;i++){const b=G.blds[i];if(b.team===team&&b.k==='hall'&&b.done&&b.hp>0&&b.tier>m)m=b.tier;}return m;}
const UPG_C=[[100,40,30],[160,80,45],[220,120,60]];
function research(b,k){
if(!b.done||b.rs)return b.rs?'연구 중입니다':'건설 중입니다';
const U=upg(b.team),L=U[k];
if(L>=3)return '최대 단계입니다';
if(maxTier(b.team)<L)return '본진 승급이 필요합니다';
const c=UPG_C[L],r=G.res[b.team];
if(r.g<c[0]||r.w<c[1])return r.g<c[0]?'금이 부족합니다':'나무가 부족합니다';
r.g-=c[0];r.w-=c[1];b.rs={k:k,t:0,time:c[2]};
return '';
}
function nearMerc(){
const mc=G.merc;
for(let i=0;i<G.units.length;i++){const u=G.units[i];if(u.team===0&&u.hp>0&&!u.hidden&&d2(u.x,u.y,mc.x,mc.y)<230*230)return true;}
return false;
}
function hireMerc(){
const mc=G.merc,d=ud(0,'merc'),r=G.res[0];
if(!nearMerc()){say('아군 유닛이 용병 캠프 가까이 있어야 합니다');sfx('err');return;}
if(mc.stock<=0){say('용병이 모두 고용되었습니다');sfx('err');return;}
if(r.g<d.cost[0]){say('금이 부족합니다');sfx('err');return;}
if(G.popUsed[0]+d.food>G.popCap[0]){say('농장이 필요합니다 (인구 한도)');sfx('err');return;}
r.g-=d.cost[0];mc.stock--;if(mc.stock===2)mc.cd=60;
const u=addUnit('merc',0,mc.x+rnd(-30,30),mc.y+mc.r+20);
G.fx.push({k:'spawn',x:u.x,y:u.y,t:0,d:0.7,c:'255,210,120'});
u.ord='move';u.tx=PH.x+120;u.ty=PH.y-40;
sfx('train');say('용병 거인을 고용했습니다');
}
function cancelBld(b){
if(!b||b.done||b.team!==0)return;
const c=bd(b.team,b.k).cost,r=G.res[0];
r.g+=Math.floor(c[0]*0.75);r.w+=Math.floor(c[1]*0.75);
for(let i=0;i<G.units.length;i++){const u=G.units[i];if(u.ord==='build'&&u.tgt===b){u.ord='idle';u.tgt=null;u.inB=false;}}
if(b.auto&&G.race[0]>=2){const w=addUnit('worker',0,b.x,b.y+b.r+14);w.ord='idle';}
b.hp=0;
G.sel=G.sel.filter(function(e){return e!==b;});
sfx('click');
}

function hasBld(team,k){
for(let i=0;i<G.blds.length;i++){const b=G.blds[i];if(b.team===team&&b.k===k&&b.done)return true;}
return false;
}

function cancelQ(b,i){
const it=b.q[i];
if(!it)return;
const r=G.res[b.team];
r.g+=it.cost[0];r.w+=it.cost[1];if(it.fr)G.hfree[b.team]=true;
b.q.splice(i,1);
}

function placeBuild(k,x,y,workers,q){
const d=bd(0,k),r=G.res[0];
if(k==='tower'&&!hasBld(0,'rax')){say('병영이 필요합니다');sfx('err');return false;}
if(k==='tavern'&&!hasBld(0,'altar')){say('제단이 필요합니다');sfx('err');return false;}
if(r.g<d.cost[0]||r.w<d.cost[1]){say(r.g<d.cost[0]?'금이 부족합니다':'나무가 부족합니다');sfx('err');return false;}
const sp=snapPos(k,x,y);x=sp.x;y=sp.y;
if(!bldFree(k,x,y)){say('이곳에는 지을 수 없습니다');sfx('err');return false;}
if(G.race[0]===2&&k!=='hall'&&!blighted(0,x,y)){say('황폐한 땅 위에만 지을 수 있습니다 (본진·납골당 주변)');sfx('err');return false;}
r.g-=d.cost[0];r.w-=d.cost[1];
const b=addBld(k,0,x,y,false);
const n=consumes(0,k)?1:workers.length;
for(let i=0;i<n;i++){const w=workers[i];if(q&&(w.ord==='build'||(w.oq&&w.oq.length))){(w.oq||(w.oq=[])).push({k:'build',t:b});}else{w.ord='build';w.tgt=b;w.gt=0;w.carry=0;w.oq=null;}}
sfx('build');
return b;
}

function updateBld(b,dt){
b.flash-=dt;
if(!b.done&&!b.auto&&consumes(b.team,b.k)){
b.wt=(b.wt||0)+dt;
if(b.wt>1){
b.wt=0;
let has=false;
for(let i=0;i<G.units.length;i++){const u=G.units[i];if(u.hp>0&&((u.ord==='build'&&u.tgt===b)||(u.oq&&u.oq.some(function(o){return o.t===b;})))){has=true;break;}}
b.orph=has?0:(b.orph||0)+1;
if(b.orph>=3){const c=bd(b.team,b.k).cost;G.res[b.team].g+=c[0];G.res[b.team].w+=c[1];b.hp=0;}
}
}
if(b.auto&&!b.done){
b.prog=Math.min(1,b.prog+dt/bd(b.team,b.k).time*(b.team?aiSpd():1));
b.hp=Math.min(b.mhp,b.mhp*(0.1+0.9*b.prog));
if(b.prog>=1)finishBld(b);
}
if(b.k==='tower'&&b.done){
b.acd-=dt;
if(b.acd<=0){
let best=null,bd=TOWER_R*TOWER_R;
for(let i=0;i<G.units.length;i++){const e=G.units[i];if(e.team===b.team||e.hp<=0||e.hidden)continue;const d=d2(b.x,b.y,e.x,e.y);if(d<bd){bd=d;best=e;}}
if(best){b.acd=1.1;hurt(best,24,b);G.fx.push({k:'bolt',x:b.x,y:b.y-b.r*1.7,x2:best.x,y2:best.y-10,t:0,d:0.15});sfx('hit');}
else b.acd=0.25;
}
}
if(b.rs){
b.rs.t+=dt*(b.team?aiSpd():1);
if(b.rs.t>=b.rs.time){const U=upg(b.team);U[b.rs.k]++;if(b.team===0){say((b.rs.k==='w'?'무기':'방어구')+' 강화 Lv'+U[b.rs.k]+' 완료');sfx('train');}b.rs=null;}
}
if(b.upT>0){
b.upT-=dt*(b.team?aiSpd():1);
if(b.upT<=0){b.upT=0;b.tier++;b.mhp+=600;b.hp+=600;G.fx.push({k:'pillar',x:b.x,y:b.y,t:0,d:1.4,c:'255,220,120'});if(b.team===0){say(rn(0,b.tier===1?'keep':'castle')+'(으)로 업그레이드되었습니다');sfx('train');}}
}
if(!b.done||!b.q.length)return;
const it=b.q[0];
it.t+=dt*(b.team?aiSpd():1);
if(it.t>=it.time){
b.q.shift();
const u=addUnit(it.k,b.team,b.x+rnd(-20,20),b.y+b.r+16,it.ht);
u.home=b;
G.fx.push({k:'spawn',x:u.x,y:u.y,t:0,d:0.6,c:RING[G.race[b.team]]||'255,255,255'});
if(it.k==='hero'){G.fx.push({k:'pillar',x:u.x,y:u.y,t:0,d:1.2,c:'255,240,170'});}
if(it.k==='hero'&&b.team===0&&G.hv[it.ht]){const hd=G.hv[it.ht];for(let l=2;l<=hd.lv;l++){applyLv(u);}u.lv=hd.lv;u.xp=hd.xp;u.sk=hd.sk.slice();u.pts=hd.pts;for(let q=0;q<6;q++)if(hd.inv&&hd.inv[q]!==null&&hd.inv[q]!==undefined)giveItem(u,hd.inv[q]);u.hp=u.mhp;u.mana=u.mmana;hd.dead=false;}
if(it.k==='worker'){
if(b.rt){
let rr=b.rt.isM?(b.rt.gold>0?b.rt:nearMine(b.rt.x,b.rt.y,b.team)):(b.rt.alive?b.rt:nearTree(b.rt.x,b.rt.y,600));
if(rr){b.rt=rr;startGather(u,rr);}else{u.ord='move';u.tx=b.rx;u.ty=b.ry;}
}
}else{
u.ord='move';u.tx=b.rx;u.ty=b.ry;
}
if(b.team===0){sfx('train');say(rn(0,it.k)+' 훈련 완료');}
}
}

function updateFx(dt){
if(G.shake>0)G.shake=Math.max(0,G.shake-dt*1.6);
for(let i=G.fx.length-1;i>=0;i--){
const f=G.fx[i];
f.t+=dt;
if(f.k==='beam'&&!f.hit&&f.t>=0.4){
f.hit=true;
for(let j=0;j<G.units.length;j++){const e=G.units[j];if(e.team!==f.team&&e.hp>0&&d2(f.x,f.y,e.x,e.y)<(f.rad||95)*(f.rad||95))hurt(e,f.dmg,f.src,'magic');}
for(let j=0;j<G.blds.length;j++){const e=G.blds[j];if(e.team!==f.team&&e.hp>0&&d2(f.x,f.y,e.x,e.y)<((f.rad||95)+e.r*0.6)*((f.rad||95)+e.r*0.6))hurt(e,f.dmg*0.7,f.src);}
}

function separate(){
const us=G.units;
for(let i=0;i<us.length;i++){
const a=us[i];
if(a.hp<=0)continue;
for(let j=i+1;j<us.length;j++){
const b=us[j];
if(b.hp<=0)continue;
const dx=b.x-a.x,dy=b.y-a.y;
const m=(a.r+b.r)*0.85;
if(dx>m||dx<-m||dy>m||dy<-m)continue;
const dd=dx*dx+dy*dy;
if(dd<m*m){
const d=Math.sqrt(dd)||0.1,k=(m-d)/d*0.5;
const wa=a.moving?0.3:0.7,wb=b.moving?0.3:0.7,s=wa+wb;
a.x-=dx*k*wa/s*2;a.y-=dy*k*wa/s*2;
b.x+=dx*k*wb/s*2;b.y+=dy*k*wb/s*2;
}
}
}
}

for(let i=0;i<list.length;i++){

function wrapText(g,t,x,y,w,lh){
let line='',yy=y;
const ws=t.split(' ');
for(let i=0;i<ws.length;i++){
const test=line?line+' '+ws[i]:ws[i];
if(g.measureText(test).width>w&&line){g.fillText(line,x,yy);line=ws[i];yy+=lh;}else line=test;
}
if(line)g.fillText(line,x,yy);
}
